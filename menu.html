<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu - Shouryanga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<section class="menu-page">
  <h1>Explore Our Menu</h1>

  <div class="menu-section">
    <h2>Main Dishes</h2>
    <div class="menu-grid">
      <div class="menu-card">
        <input type="checkbox" value="Veg Samosa|30" class="menu-check">
        <img src="https://www.cookwithmanali.com/wp-content/uploads/2021/03/Veg-Samosa-500x375.jpg">
        <h3>Veg Samosa</h3><p>₹30</p>
      </div>
      <div class="menu-card">
        <input type="checkbox" value="Chicken Curry|120" class="menu-check">
        <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2022/07/chicken-curry-recipe.jpg">
        <h3>Chicken Curry</h3><p>₹120</p>
      </div>
    </div>
  </div>

  <div class="center">
    <button id="buyNow">Buy Now</button>
  </div>
</section>

<script>
  document.getElementById("buyNow").onclick = () => {
    const selected = [...document.querySelectorAll(".menu-check:checked")].map(cb => {
      const [name, price] = cb.value.split("|");
      return { name, price: Number(price) };
    });

    if (selected.length === 0) return alert("Please select at least one item.");

    const username = prompt("Enter your name:");
    const mobile = prompt("Enter your mobile number:");

    if (!username || !mobile) {
      alert("Name and mobile number are required.");
      return;
    }

    sessionStorage.setItem("order", JSON.stringify({
      name: username,
      mobile,
      items: selected
    }));

    location.href = "checkout.html";
  };
</script>
</body>
</html>
